apiVersion: v1
kind: Secret
metadata:
  name: oficina-billing-secret
  namespace: oficina
type: Opaque
stringData:
  MONGODB_URI: "mongodb://billing:<senha>@oficina-billing-mongodb:27017/?authSource=admin"
  JWT_SECRET: "<o-mesmo-JWT_SECRET-do-OS-Service>"
  JWT_CLIENTE_SECRET: "<o-mesmo-JWT_CLIENTE_SECRET-do-OS-Service-e-da-Lambda>"
  RABBITMQ_URL: "amqp://oficina:<senha>@rabbitmq.plataforma.svc.cluster.local:5672"
  MERCADO_PAGO_ACCESS_TOKEN: "<TEST-... do painel de desenvolvedor do Mercado Pago>"
  MERCADO_PAGO_WEBHOOK_SECRET: "<assinatura secreta do webhook>"
  NEW_RELIC_LICENSE_KEY: "<chave-de-ingestao-do-new-relic>"
