apiVersion: v1
kind: Service
metadata:
  name: oficina-billing-mongodb
  namespace: oficina
  labels:
    app: oficina-billing-mongodb
spec:
  clusterIP: None
  selector:
    app: oficina-billing-mongodb
  ports:
    - name: mongodb
      port: 27017
      targetPort: mongodb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: oficina-billing-mongodb
  namespace: oficina
  labels:
    app: oficina-billing-mongodb
    app.kubernetes.io/part-of: oficina
spec:
  serviceName: oficina-billing-mongodb
  replicas: 1
  selector:
    matchLabels:
      app: oficina-billing-mongodb
  template:
    metadata:
      labels:
        app: oficina-billing-mongodb
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
      containers:
        - name: mongodb
          image: mongo:8.0
          ports:
            - name: mongodb
              containerPort: 27017
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oficina-billing-mongodb
                  key: usuario
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oficina-billing-mongodb
                  key: senha
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mongodb
            initialDelaySeconds: 30
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 999
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: dados
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: dados
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: oficina-billing-mongodb
  namespace: oficina
spec:
  podSelector:
    matchLabels:
      app: oficina-billing-mongodb
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: oficina-billing
      ports:
        - port: 27017
